# ~/.pi-hub/prices.yaml: manual model prices, USD per 1M tokens (stage 2 FR-116, BD-023).
# A step's cost comes from, in order: the provider's own cost -> Pi's catalog cost
# (Pi computes it in message_end) -> this file (tokens x price) -> "price unknown".
# Only list models nobody else prices: providers from Pi extensions, System One models,
# zero-priced catalog entries, custom deals. The hub re-reads the file when it changes.
- model: Deepseek-v4.1-flash
  provider: 9router # a provider registered by a personal Pi extension (pi.extensions)
  input: 0.07 # example values: take them from the provider's pricing page
  output: 0.28
  cache_read: 0.007
  cache_write: null
- model: jev-1.14.0
  provider: typesafe
  input: 0.042 # docs.typesafe.ai/models: $42 per 1B input tokens; Pi catalog says 0
  output: 0 # output tokens are free
  cache_read: null
  cache_write: null
  valid_from: 2026-11-26
- model: jev-1.13.0
  provider: typesafe
  input: 0.042
  output: 0
  cache_read: null
  cache_write: null
  valid_from: 2026-11-26
