# ~/.pi-hub/config.yaml
data_dir: ~/.pi-hub
delegation_default: off
allowed_repos:
  - ~/Projects/example
pi:
  version: "1.6.1" # pinned; upgrade only after adapter tests pass
  bin: pi
  # Provider extensions loaded into workers besides the pi-hub one (workers still run with -ne).
  # extensions: [~/.pi/agent/extensions/9router.ts]
# Roles (stage 3 FR-201): model = <pi provider>/<model id>; escalate = models tried in order
# after a FAIL that survives the auto round (ADR-0013); description = one line for the
# smart router. Order below is the author's pick after benchmarks/results/2026-11-27.md.
roles:
  code:
    model: 9router/Deepseek-v4.1-flash
    description: writing or changing code and its tests
    escalate: [9router/Inkling-2-small, 9router/Hy4-flash]
  docs:
    model: 9router/Deepseek-v4.1-flash
    description: "documentation only: README and docs, no code"
default_role: code
# Smart router (ADR-0008): picks a role via System One when the senior gave neither role nor
# model. Needs smart: true, system_one and at least two roles. Key only in ~/.pi-hub/.env.
router:
  smart: false
  # system_one:
  #   preset: 9router            # fills url, api_key_env (NINEROUTER_API_KEY), model
  #   model: typesafe/jev-latest
  #   min_confidence: 0.75       # below: default_role
  #   timeout_ms: 3000           # on timeout or error: default_role, reason system_one_unavailable
transport:
  unix_socket: ~/.pi-hub/hub.sock
  # http: { host: 127.0.0.1, port: 7433 }   # remote: only via SSH tunnel / VPN
limits:
  max_workers_hub: 4
  max_workers_project: 2
  max_workers_session: 2
  # Per-task ceilings are off by default (BD-021): uncomment to stop a runaway worker.
  # max_task_minutes: 60
  # max_task_usd: 2.0
clients: # ADR-0006, ADR-0010
  claude-code: { tool_list: dynamic, max_wait_sec: 1500, progress_every_sec: 60 }
  codex: { tool_list: static, max_wait_sec: 870 } # off on connect, like every client (D-207)
  mcp: { tool_list: static, max_wait_sec: 50 }
orphan_after_minutes: 30
notify_user_after_minutes: 15
retention_days: 30
