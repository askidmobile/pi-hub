# ~/.pi-hub/config.yaml
data_dir: ~/.pi-hub
delegation_default: off
allowed_repos:
  - ~/Projects/example
pi:
  version: "1.6.1" # pinned; upgrade only after adapter tests pass
  bin: pi
  # Provider extensions loaded into workers besides the pi-hub one (workers still run with -ne).
  # extensions: [~/.pi/agent/extensions/9router.ts]
transport:
  unix_socket: ~/.pi-hub/hub.sock
  # http: { host: 127.0.0.1, port: 7433 }   # remote: only via SSH tunnel / VPN
limits:
  max_workers_hub: 4
  max_workers_project: 2
  max_workers_session: 2
  max_task_minutes: 60 # FR-021
  max_task_usd: 2.0 # FR-025, hard stop per task
clients: # ADR-0006, ADR-0010
  claude-code: { tool_list: dynamic, max_wait_sec: 1500, progress_every_sec: 60 }
  codex: { tool_list: static, max_wait_sec: 870, delegation_on_connect: true }
  mcp: { tool_list: static, max_wait_sec: 50 }
orphan_after_minutes: 30
notify_user_after_minutes: 15
retention_days: 30
