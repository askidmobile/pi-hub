# .pi-hub.toml in a repository root
delegation = "on"
daily_budget_usd = 5.0
# Runs in a fresh worktree before the worker starts (spec stage 1, FR-024).
setup = "pnpm install --frozen-lockfile"

[quality]
test = "pnpm test"
lint = "pnpm lint"
typecheck = "pnpm typecheck"
# Each command is stopped after this many minutes (with its child processes).
timeout_minutes = 15
