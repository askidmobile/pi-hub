# Codex architect profile for pi-hub (stage 3, ADR-0009). Usually installed by `pi-hub init`:
# it writes only the block between the markers into ~/.codex/pi-hub.config.toml and keeps
# everything else (Codex stores hook trust and trusted folders in the same file).
# Start with `codex --profile pi-hub`; trust the pi-hub hook once in /hooks.
# Remote hub: command = "ssh", args = ["build-box", "pi-hub-shim", "--client", "codex"].

# >>> pi-hub (managed by pi-hub init up to the closing marker; edit outside the block)
[mcp_servers.pi-hub]
command = "pi-hub-shim"
args = ["--client", "codex"]
tool_timeout_sec = 900
default_tools_approval_mode = "approve"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "pi-hub-shim hook stop --client codex"
timeout = 2
# <<< pi-hub
